[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "materials-engine"
version = "0.0.1"
description = "Emergent materials engine — deterministic crafting/engineering substrate"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["engine", "engine.properties", "chemistry", "machines", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
